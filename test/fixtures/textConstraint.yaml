# Check static text for word count, casing, forbidden words, and trailing punctuation.
id: textConstraint
let:
  text: { op: text, args: [$node] }
  words: { op: words, args: [$text.text] }
  lower: { op: lowerAll, args: [$words] }
when: { op: "=", args: [$text.dynamic, false] }
some:
  - every:
      - { op: exists, args: [{ key: options.maxWords }] }
      - { op: ">", args: [{ op: count, args: [$words] }, { key: options.maxWords }] }
  - every:
      - { op: "=", args: [{ key: options.casing }, title] }
      - not: { op: isTitleCase, args: [$text.text] }
  - every:
      - { op: "=", args: [{ key: options.casing }, sentence] }
      - not: { op: isSentenceCase, args: [$text.text] }
  - for: { each: { key: options.forbidWords }, as: word }
    when: { op: in, args: [{ op: lower, args: [$word] }, $lower] }
  - every:
      - { op: "=", args: [{ key: options.forbidTrailingPunctuation }, true] }
      - { op: endsWithPunctuation, args: [$text.text] }
report: { at: $node }
